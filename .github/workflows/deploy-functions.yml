name: Deploy the Discord bot

# Puts the Edge Functions in supabase/functions on Supabase whenever they change on master.
# Needs the repository secret SUPABASE_ACCESS_TOKEN (Settings > Secrets and variables > Actions > Secrets)
# and the SUPABASE_URL variable the site already uses (the project is read from it).
# "Run workflow" on the Actions tab deploys them by hand.

on:
  push:
    branches: [master]
    paths: ['supabase/functions/**', 'supabase/config.toml', '.github/workflows/deploy-functions.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test and type-check the functions
        run: npx vitest run supabase && npm run check:functions
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret first (see README, Discord bot)."; exit 1; fi
          ref=$(echo "$SUPABASE_URL" | sed -E 's#^https://([a-z0-9]+)\.supabase\.co.*#\1#')
          if [ -z "$ref" ] || [ "$ref" = "$SUPABASE_URL" ]; then echo "::error::Set the SUPABASE_URL repository variable (https://<project>.supabase.co)."; exit 1; fi
          # Discord signs its own requests and the database sends its secret, so Supabase's sign-in check is off for both.
          supabase functions deploy discord-interactions --project-ref "$ref" --no-verify-jwt
          supabase functions deploy discord-announce --project-ref "$ref" --no-verify-jwt
