name: Release addon

# Push a tag like addon-v1.0.0 to package FantasyForce and upload it to CurseForge.
on:
  push:
    tags:
      - "addon-v*"

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the packager reads tags and history for the version and changelog

      # -t: the addon folder is the top level of the package (its .toc sits there)
      # -m: the .pkgmeta lives one level up, in addon/
      - uses: BigWigsMods/packager@v2
        with:
          args: -p ${{ vars.CF_PROJECT_ID }} -t addon/FantasyForce -m addon/.pkgmeta
